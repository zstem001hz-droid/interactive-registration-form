<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Registration Form</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script defer src="./scripts/script.js"></script>
</head>

<body>
    <div class="container">
        <h1>User Registration:</h1>

        <!-- nonvalidate - tells the browser not to show its default validation -->
        <form id="registrationForm" novalidate>

            <!-- username requirements -->
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
                required
                minlength="3"
                maxlength="20"
                pattern="[A-Za-z0-9_]+"
                autocomplete="username"

                <span class="error-message" id="usernameError"></span>
            </div>


            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="emailError"></span>
            </div>


            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <small>Password must be at least 8 characters long, include an uppercase letter, a lowercase letter, and
                    a number.</small>
                <span class="error-message" id="passwordError"></span>


            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword">
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <button type="submit">Register</button>

        </form>
    </div>
</body>

</html>
